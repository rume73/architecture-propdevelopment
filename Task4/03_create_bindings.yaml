apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
  namespace: development
subjects:
- kind: ServiceAccount
  name: developer
  namespace: development
roleRef:
  kind: Role
  name: developer
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devops-binding
  namespace: development
subjects:
- kind: ServiceAccount
  name: devops
  namespace: development
roleRef:
  kind: Role
  name: devops
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-binding
  namespace: secure-space
subjects:
- kind: ServiceAccount
  name: security
  namespace: secure-space
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-binding
subjects:
- kind: ServiceAccount
  name: infra
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-infra-reader
  apiGroup: rbac.authorization.k8s.io